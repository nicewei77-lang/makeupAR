<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E7 Lip User Adjustment Review</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <h1>E7 Lip User Adjustment</h1>
            <p class="status-line" id="statusLine">슬라이더와 +/- 버튼으로 네 조정값을 직접 시험합니다.</p>
          </div>
          <div class="top-actions">
            <button id="loadSampleButton" type="button">샘플 자동 로드</button>
            <label class="file-button">
              후보 JSON
              <input id="candidateJsonInput" type="file" accept=".json,application/json" />
            </label>
            <label class="file-button">
              출력 폴더 선택
              <input id="assetFolderInput" type="file" webkitdirectory multiple />
            </label>
          </div>
        </header>

        <section class="content-grid">
          <section class="main-panel">
            <div class="mode-panel" data-panel="slider">
              <div class="panel-heading">
                <h2>슬라이더 조정</h2>
                <span class="badge">+/- step 0.05</span>
              </div>
              <div id="sliderControls" class="control-stack">
                <div class="range-row" data-key="cornerReach">
                  <label for="range-cornerReach">
                    cornerReach
                    <small>+ 입꼬리 쪽 확장, - 입꼬리 spill 축소</small>
                  </label>
                  <button class="step-button" type="button" data-action="decrement">-</button>
                  <input id="range-cornerReach" type="range" min="-1" max="1" step="0.05" value="0" />
                  <button class="step-button" type="button" data-action="increment">+</button>
                  <span class="number-pill">0.00</span>
                </div>
                <div class="range-row" data-key="upperLipTightness">
                  <label for="range-upperLipTightness">
                    upperLipTightness
                    <small>+ 윗입술을 타이트하게, - 윗입술 덮임 증가</small>
                  </label>
                  <button class="step-button" type="button" data-action="decrement">-</button>
                  <input id="range-upperLipTightness" type="range" min="-1" max="1" step="0.05" value="0" />
                  <button class="step-button" type="button" data-action="increment">+</button>
                  <span class="number-pill">0.00</span>
                </div>
                <div class="range-row" data-key="lowerLipTightness">
                  <label for="range-lowerLipTightness">
                    lowerLipTightness
                    <small>+ 아랫입술을 타이트하게, - 아랫입술 덮임 증가</small>
                  </label>
                  <button class="step-button" type="button" data-action="decrement">-</button>
                  <input id="range-lowerLipTightness" type="range" min="-1" max="1" step="0.05" value="0" />
                  <button class="step-button" type="button" data-action="increment">+</button>
                  <span class="number-pill">0.00</span>
                </div>
                <div class="range-row" data-key="verticalOffset">
                  <label for="range-verticalOffset">
                    verticalOffset
                    <small>image-space 기준 + 아래, - 위</small>
                  </label>
                  <button class="step-button" type="button" data-action="decrement">-</button>
                  <input id="range-verticalOffset" type="range" min="-1" max="1" step="0.05" value="0" />
                  <button class="step-button" type="button" data-action="increment">+</button>
                  <span class="number-pill">0.00</span>
                </div>
              </div>
            </div>
          </section>

          <aside class="side-panel">
            <div class="preview-tools">
              <button id="resetParamsButton" type="button">Reset</button>
              <button id="confirmButton" type="button">Confirm</button>
            </div>
            <div class="preview-frame">
              <img
                id="selectionPreview"
                alt="Selected candidate preview"
                src="./local-assets/e7-user-adjustment-smoke/user_adjustment_candidate_ua-00-baseline_overlay.png"
              />
              <canvas id="adjustmentCanvas" width="480" height="640"></canvas>
              <div id="previewFallback" class="preview-fallback">샘플 자동 로드 또는 후보 출력 폴더 선택 후 미리보기가 표시됩니다.</div>
            </div>
            <dl class="param-readout" id="paramReadout"></dl>
            <div class="export-box">
              <label for="reviewJsonOutput">user_adjustment_review.json</label>
              <textarea id="reviewJsonOutput" spellcheck="false"></textarea>
              <div class="export-actions">
                <button id="downloadReviewButton" type="button">Download review JSON</button>
                <button id="downloadCandidatesButton" type="button">Download candidates JSON</button>
                <button id="downloadMaskButton" type="button">Download custom mask PNG</button>
              </div>
            </div>
          </aside>
        </section>
      </section>
    </main>
    <script src="./app.js?v=slider-only-20260626-9"></script>
  </body>
</html>
