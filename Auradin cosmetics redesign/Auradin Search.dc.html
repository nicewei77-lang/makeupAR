<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=Nixie+One&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,'Segoe UI',sans-serif;background:#E9E7E8}
:root{--ink:#111;--ink2:#6B6B6B;--ink3:#B7B2B2;--line:#E6E6E6;--line2:#D8D8D8;--muted:#F7F7F7;--aura:#C26572}
.phone{position:relative;width:390px;height:844px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.sb{display:flex;align-items:center;justify-content:space-between;padding:14px 26px 2px;font-size:15px;font-weight:600;color:var(--ink);flex:none}
.sb-r{display:flex;align-items:center;gap:7px}
.batt{width:24px;height:12px;border:1.4px solid var(--ink);border-radius:3px;position:relative;padding:1.6px}
.batt i{display:block;height:100%;width:72%;background:var(--ink);border-radius:1px}
.batt:after{content:'';position:absolute;right:-3px;top:3.5px;width:2px;height:5px;background:var(--ink);border-radius:1px}
.head{flex:none;padding:8px 20px 4px;cursor:pointer}
.wordmark{font-family:'Nixie One',serif;font-size:44px;letter-spacing:5px;color:var(--ink);line-height:1;transition:font-size .45s ease,letter-spacing .45s ease}
.tagline{font-size:12.5px;color:var(--ink2);margin-top:6px;letter-spacing:.4px;height:18px;overflow:hidden;transition:opacity .35s,height .35s,margin .35s}
.head.small .wordmark{font-size:26px;letter-spacing:3px}
.head.small .tagline{opacity:0;height:0;margin-top:0}
.content{flex:1;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 72% at 50% -8%,rgba(231,154,163,.22),transparent 56%);opacity:.4;transition:opacity .7s ease}
.bg.strong{opacity:1}
.ic{display:block}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px 16px 116px;opacity:0;transform:scale(.985) translateY(12px);transition:opacity .5s ease,transform .5s ease;pointer-events:none;overflow-y:auto}
.layer::-webkit-scrollbar{display:none}
.layer.on{opacity:1;transform:none;pointer-events:auto}
.layer.home{gap:16px}
.layer.home>*{flex:none}
.layer.searching,.layer.question{align-items:center;justify-content:center;text-align:center}
.hero{position:relative;height:292px;border-radius:24px;overflow:hidden;background:var(--muted);box-shadow:0 8px 22px rgba(0,0,0,.09)}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.hero-aura{position:absolute;left:8%;right:8%;top:30%;height:56%;border-radius:50%;background:radial-gradient(circle at 50% 56%,rgba(216,110,124,.9),rgba(216,110,124,0) 64%);filter:blur(14px);mix-blend-mode:screen;opacity:.5;transition:opacity .7s ease,transform .7s ease;animation:aura 5s ease-in-out infinite}
.hero.bloom .hero-aura{opacity:.95;transform:scale(1.2)}
.hero.bloom .hero-img{transform:scale(1.045)}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),transparent 30%,transparent 64%,rgba(0,0,0,.36))}
.shade{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.92);border-radius:999px;padding:7px 14px 7px 9px}
.shade-dots{display:flex}
.shade-dots i{width:16px;height:16px;border-radius:50%;border:1.6px solid #fff;margin-right:-5px;display:block}
.shade-tx{font-size:12.5px;font-weight:700;color:var(--ink)}
.composer{background:#fff;border:1.5px solid var(--line2);border-radius:22px;padding:15px;box-shadow:0 8px 22px rgba(0,0,0,.06);transition:border-color .25s,box-shadow .25s}
.composer:focus-within{border-color:var(--aura);box-shadow:0 8px 26px rgba(194,101,114,.2)}
.composer textarea{width:100%;border:0;outline:0;resize:none;font-family:inherit;font-size:16px;line-height:23px;color:var(--ink);min-height:46px;background:transparent}
.composer textarea::placeholder{color:var(--ink3)}
.bar{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.tool{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.tool:active{transform:scale(.9)}
.send{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.send:active{transform:scale(.9)}
.sugs{display:flex;flex-wrap:wrap;gap:8px}
.sug{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:transform .12s}
.sug:active{transform:scale(.96)}
.kawaii{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center}
.kw-ring{position:absolute;width:216px;height:216px;border:3px dashed rgba(216,122,134,.42);border-radius:50%;animation:spinSlow 9s linear infinite}
.kw-blob{position:absolute;width:94px;height:94px;border-radius:48% 52% 55% 45%;filter:blur(7px);opacity:.5;animation:blobby 4s ease-in-out infinite}
.kw-blob.b1{background:#FFC9DD;left:22px;top:40px}
.kw-blob.b2{background:#FFE0C2;right:24px;top:52px;animation-delay:.8s}
.kw-blob.b3{background:#E6D5FF;left:74px;bottom:30px;animation-delay:1.5s}
.kw-stage{position:relative;width:176px;height:176px;display:flex;align-items:center;justify-content:center}
.kw-stage img{position:absolute;width:168px;height:168px;object-fit:contain;opacity:0;filter:drop-shadow(0 12px 18px rgba(150,70,82,.22));-webkit-mask-image:radial-gradient(circle at 50% 47%,#000 50%,transparent 72%);mask-image:radial-gradient(circle at 50% 47%,#000 50%,transparent 72%);animation:pop 4.2s cubic-bezier(.5,1.55,.45,1) infinite}
.kw-stage img:nth-of-type(2){animation-delay:1.4s}
.kw-stage img:nth-of-type(3){animation-delay:2.8s}
.spark{position:absolute;color:#E6889A;font-size:18px;line-height:1;text-shadow:0 0 8px rgba(230,136,154,.55);animation:twinkle 1.8s ease-in-out infinite}
.spark.s1{top:12px;left:42px;font-size:21px}
.spark.s2{top:30px;right:28px;animation-delay:.5s}
.spark.s3{bottom:32px;right:50px;font-size:23px;animation-delay:1s}
.spark.s4{bottom:18px;left:34px;animation-delay:1.4s}
.prod-single{display:flex;align-items:center;justify-content:center;width:132px;height:132px}
.prod-single img{width:114px;height:114px;object-fit:contain;filter:drop-shadow(0 12px 18px rgba(150,70,82,.2));-webkit-mask-image:radial-gradient(circle at 50% 47%,#000 52%,transparent 74%);mask-image:radial-gradient(circle at 50% 47%,#000 52%,transparent 74%);animation:floatY 3.6s ease-in-out infinite}
.echo{margin-bottom:28px;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--ink2);backdrop-filter:blur(8px)}
.loader{margin-top:32px;display:flex;align-items:center;font-size:16.5px;font-weight:800;color:var(--ink);letter-spacing:-.2px}
.dots{display:inline-flex;gap:4px;margin-left:7px;align-items:center}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--aura)}
.dots i:nth-child(1){animation:blink 1.2s infinite}
.dots i:nth-child(2){animation:blink 1.2s infinite .2s}
.dots i:nth-child(3){animation:blink 1.2s infinite .4s}
.gline{height:4px;width:208px;border-radius:3px;margin-top:20px;background:linear-gradient(90deg,#EFA3B4,#C26572,#D77A75,#EFA3B4);background-size:200% 100%;animation:flow 2.4s linear infinite}
.tsteps{margin-top:28px;width:100%;max-width:268px;display:flex;flex-direction:column;gap:14px;text-align:left}
.tstep{display:flex;align-items:center;gap:11px;font-size:13.5px;font-weight:600;color:var(--ink3)}
.tstep .td{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.tstep.done{color:var(--ink2)}
.tstep.done .td{background:var(--ink)}
.tstep.act{color:var(--ink);font-weight:800}
.tstep.act .td{background:var(--aura);animation:breathe 1.4s ease-in-out infinite}
.searching.on .tstep{animation:rise .5s both}
.searching.on .tstep:nth-child(1){animation-delay:.05s}
.searching.on .tstep:nth-child(2){animation-delay:.22s}
.searching.on .tstep:nth-child(3){animation-delay:.4s}
.q-eyebrow{margin-top:26px;font-size:12.5px;font-weight:800;letter-spacing:.6px;color:var(--aura)}
.q-title{font-size:23px;font-weight:800;color:var(--ink);line-height:1.34;margin-top:10px;letter-spacing:-.3px;white-space:pre-line}
.q-tiles{display:flex;gap:12px;margin-top:30px;width:100%}
.tile{flex:1;height:160px;border-radius:24px;position:relative;overflow:hidden;border:none;cursor:pointer;display:flex;align-items:flex-end;padding:16px;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile.pink{background:linear-gradient(155deg,#F8C8D2,#EEA4B2)}
.tile.rose{background:linear-gradient(155deg,#CF7A85,#A8525C)}
.tile:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 52%,rgba(0,0,0,.2))}
.tile-label{font-size:16px;font-weight:800;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.22);position:relative;z-index:1}
.q-skip{margin-top:20px;background:none;border:none;color:var(--ink2);font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.r-eyebrow{font-family:'Nixie One',serif;font-size:13px;letter-spacing:2.5px;color:var(--aura)}
.r-title{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.4px;margin-top:3px}
.r-sub{font-size:14px;color:var(--ink2);margin-top:5px;font-weight:600}
.reveal{opacity:0}
.results.on .reveal{animation:rise .55s both}
.results.on .reveal:nth-child(1){animation-delay:.05s}
.results.on .reveal:nth-child(2){animation-delay:.15s}
.results.on .reveal:nth-child(3){animation-delay:.26s}
.results.on .reveal:nth-child(4){animation-delay:.34s}
.results.on .reveal:nth-child(5){animation-delay:.42s}
.r-top{margin-top:18px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.07);text-align:left;cursor:pointer;display:block;width:100%;padding:0}
.r-top img{width:100%;height:174px;object-fit:cover;display:block;background:var(--muted)}
.r-top-body{padding:14px 15px 16px}
.r-brand{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.3px}
.r-name{font-size:18px;font-weight:800;color:var(--ink);margin-top:3px}
.r-meta{font-size:13.5px;color:var(--ink2);font-weight:600;margin-top:3px}
.r-why{display:flex;gap:8px;margin-top:12px;align-items:flex-start;border-top:1px solid var(--line);padding-top:12px}
.r-why .d{width:9px;height:9px;border-radius:50%;background:#C95E68;margin-top:3px;flex:none}
.r-why span{font-size:13px;color:var(--ink2);line-height:18px}
.r-alt-label{font-size:13px;font-weight:700;color:var(--ink3);margin:20px 2px 11px}
.r-alt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:11px;background:#fff;width:100%;text-align:left;cursor:pointer;margin-bottom:9px}
.r-alt img{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--muted);flex:none}
.r-alt .info{min-width:0;flex:1}
.r-alt .b{font-size:11.5px;font-weight:700;color:var(--ink3)}
.r-alt .n{font-size:14.5px;font-weight:800;color:var(--ink);margin-top:1px}
.r-alt .m{font-size:12.5px;color:var(--ink2);margin-top:1px}
.r-reset{margin:14px auto 4px;background:none;border:none;color:var(--ink3);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.footer{position:absolute;left:24px;right:24px;bottom:22px;height:50px;background:rgba(255,255,255,.74);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.85);border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:0 -6px 22px rgba(0,0,0,.1),0 10px 26px rgba(0,0,0,.1);z-index:5}
.ft{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:36px;color:var(--ink)}
.ft.on{background:rgba(34,34,34,.92);border-radius:999px;color:#fff}
.ft span{font-size:13px;font-weight:700}
.cap{flex:1;display:flex;justify-content:center}
.cap-bub{width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;transform:translateY(-7px);box-shadow:0 8px 18px rgba(0,0,0,.28)}
@keyframes aura{0%,100%{transform:scale(1);opacity:.46}50%{transform:scale(1.08);opacity:.66}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes blobby{0%,100%{transform:translateY(0) scale(1);border-radius:48% 52% 55% 45%}50%{transform:translateY(-8px) scale(1.07);border-radius:56% 44% 47% 53%}}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-14deg)}10%{opacity:1;transform:scale(1.16) rotate(7deg)}20%{transform:scale(.93) rotate(-5deg)}30%{transform:scale(1.05) rotate(3deg)}40%{transform:scale(1) rotate(0)}66%{opacity:1;transform:scale(1) rotate(0)}80%{opacity:0;transform:scale(.64) rotate(11deg)}100%{opacity:0}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(90deg)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes breathe2{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.92;transform:scale(1.1)}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes flow{to{background-position:200% 0}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.5);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;pace&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2300,&quot;min&quot;:900,&quot;max&quot;:4000,&quot;step&quot;:100,&quot;unit&quot;:&quot;ms&quot;,&quot;section&quot;:&quot;Flow&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { phase: 'home', query: '쿨톤 글로시 립, 2만원 이하', choice: null };
  labels = { 'clear-pink': '맑은 핑크', 'calm-rose': '차분한 로즈', either: '둘 다 좋아요' };

  componentDidMount() { this.applyPhase(); }
  componentDidUpdate() { this.applyPhase(); }
  componentWillUnmount() { clearTimeout(this.timer); }

  pace() { return this.props.pace ?? 2300; }

  applyPhase() {
    const { phase, query, choice } = this.state;
    const search = phase === 'searching' || phase === 'searching2';
    const set = (el, on) => { if (el) el.classList.toggle('on', on); };
    set(this.lHome, phase === 'home');
    set(this.lSearch, search);
    set(this.lQ, phase === 'question');
    set(this.lRes, phase === 'results');
    if (this.head) this.head.classList.toggle('small', phase !== 'home');
    if (this.bg) this.bg.classList.toggle('strong', phase !== 'home');
    if (this.searchLabel) this.searchLabel.textContent = phase === 'searching2' ? '딱 맞는 컬러 고르는 중!' : '아우라딘이 콕콕 찾는 중';
    if (this.echoS) this.echoS.textContent = query || '쿨톤 글로시 립, 2만원 이하';
    if (this.resultSub) {
      const cl = choice ? this.labels[choice].replace(' 좋아요', '') : '차분한 로즈';
      this.resultSub.textContent = cl + ' · 2만원 이하';
    }
  }

  submit = (q) => {
    const v = q || (this.input && this.input.value.trim()) || '쿨톤 글로시 립, 2만원 이하';
    if (this.input) this.input.value = v;
    clearTimeout(this.timer);
    this.setState({ phase: 'searching', query: v });
    this.timer = setTimeout(() => this.setState({ phase: 'question' }), this.pace());
  };

  onSuggest = (e) => this.submit(e.currentTarget.dataset.q);
  onSend = () => this.submit();

  onPick = (e) => {
    const opt = e.currentTarget.dataset.opt;
    clearTimeout(this.timer);
    this.setState({ phase: 'searching2', choice: opt });
    this.timer = setTimeout(() => this.setState({ phase: 'results' }), Math.min(this.pace(), 1700));
  };

  onSkip = () => {
    clearTimeout(this.timer);
    this.setState({ phase: 'searching2', choice: 'either' });
    this.timer = setTimeout(() => this.setState({ phase: 'results' }), Math.min(this.pace(), 1700));
  };

  reset = () => {
    clearTimeout(this.timer);
    this.setState({ phase: 'home', choice: null });
  };

  bloom = (on) => { if (this.hero) this.hero.classList.toggle('bloom', on); };

  renderVals() {
    return {
      setHead: (e) => { this.head = e; },
      setHome: (e) => { this.lHome = e; },
      setSearch: (e) => { this.lSearch = e; },
      setQ: (e) => { this.lQ = e; },
      setResults: (e) => { this.lRes = e; },
      setHero: (e) => { this.hero = e; },
      setBg: (e) => { this.bg = e; },
      setInput: (e) => { if (e && !this.input) e.value = this.state.query; this.input = e; },
      setSearchLabel: (e) => { this.searchLabel = e; },
      setEchoS: (e) => { this.echoS = e; },
      setResultSub: (e) => { this.resultSub = e; },
      onSuggest: this.onSuggest,
      onSend: this.onSend,
      onPick: this.onPick,
      onSkip: this.onSkip,
      reset: this.reset,
      onFocus: () => this.bloom(true),
      onBlur: () => this.bloom(false),
      onTapCard: () => this.bloom(false),
    };
  }
}
</script>
